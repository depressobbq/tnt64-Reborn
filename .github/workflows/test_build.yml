name: Test Build CI (No Release)

on:
  push:
    branches:
      - 'test/*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows x64 (Test Artifact)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC Dev Command Prompt (clang-cl)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja
        uses: ashutoshvarma/setup-ninja@master

      - name: Setup N64ModernRuntime
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File runtime\setup_runtime.ps1

      - name: Setup RT64
        shell: pwsh
        run: |
          $rt64 = "TNTRecomp\lib\rt64"
          if (-not (Test-Path "$rt64\CMakeLists.txt")) {
              git clone https://github.com/rt64/rt64 $rt64
              git -C $rt64 checkout 23cab603c4f9f4a8b369b38e036f1aa484603878
              git -C $rt64 submodule update --init --recursive
          }

      - name: Configure CMake (Windows)
        run: |
          cmake -B build -S TNTRecomp -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl

      - name: Compile TNTRecompiled (Windows)
        run: |
          cmake --build build --config Release

      - name: Package Windows Test Build
        shell: pwsh
        run: |
          $pkg = "TNT-Reborn-Windows-x64-test"
          New-Item -ItemType Directory -Path $pkg | Out-Null
          
          if (Test-Path "build\TNTRecompiled.exe") {
              Copy-Item "build\TNTRecompiled.exe" "$pkg\"
          } else {
              $exe = Get-ChildItem -Path "build" -Filter "TNTRecompiled.exe" -Recurse | Select-Object -First 1
              Copy-Item $exe.FullName "$pkg\"
          }

          if (Test-Path "build\SDL2.dll") {
              Copy-Item "build\SDL2.dll" "$pkg\"
          } else {
              Copy-Item "TNTRecomp\lib\rt64\src\contrib\mupen64plus-win32-deps\SDL2-2.26.3\lib\x64\SDL2.dll" "$pkg\"
          }

          if (Test-Path "build\dxcompiler.dll") {
              Copy-Item "build\dxcompiler.dll" "$pkg\"
          } else {
              Copy-Item "TNTRecomp\lib\rt64\src\contrib\dxc\bin\x64\dxcompiler.dll" "$pkg\"
          }

          if (Test-Path "build\dxil.dll") {
              Copy-Item "build\dxil.dll" "$pkg\"
          } else {
              Copy-Item "TNTRecomp\lib\rt64\src\contrib\dxc\bin\x64\dxil.dll" "$pkg\"
          }

          if (Test-Path "settings.ini") { Copy-Item "settings.ini" "$pkg\" }
          if (Test-Path "textures") { Copy-Item -Recurse "textures" "$pkg\textures" }
          if (Test-Path "soundtrack") { Copy-Item -Recurse "soundtrack" "$pkg\soundtrack" }
          if (Test-Path "custom_tracks") { Copy-Item -Recurse "custom_tracks" "$pkg\custom_tracks" }
          if (Test-Path "README.md") { Copy-Item "README.md" "$pkg\" }
          if (Test-Path "play.bat") { Copy-Item "play.bat" "$pkg\play.bat" }

          Compress-Archive -Path "$pkg\*" -DestinationPath "$pkg.zip"

      - name: Upload Windows Test Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TNT-Reborn-Windows-x64-test
          path: TNT-Reborn-Windows-x64-test.zip
